[project]
name = "travelsec"
version = "0.1.0"
description = "Audit the devices and networks around you (home, hotel, café) for surveillance and weak security."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
travelsec = "travelsec.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["travelsec"]
